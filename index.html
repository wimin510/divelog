<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人水肺潛水日誌 - 登入/註冊</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 SheetJS (用於 Excel 匯入) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- 載入 Inter 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; }
        .tab-active { border-color: #10b981; color: #10b981; font-weight: 600; }
        .tab-inactive { border-color: transparent; color: #6b7280; }
        /* Style for form elements to be consistent */
        input[type="number"], input[type="text"], input[type="date"], input[type="time"], textarea, select, input[type="email"], input[type="password"] {
            border: 1px solid #d1d5db;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem; /* rounded-md */
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            width: 100%;
        }
        .metric-unit {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 0.875rem;
            pointer-events: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">

<div id="app" class="max-w-4xl mx-auto bg-white shadow-xl rounded-xl p-4 md:p-8">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-6 border-b pb-3">
        個人潛水日誌管理
    </h1>

    <!-- 頁面容器 -->
    <div id="page-content">
        <!-- 內容將由 JavaScript 動態插入 (Auth Form / Main App) -->
    </div>

    <!-- 訊息彈窗 (Modal) -->
    <div id="modal-container" class="hidden fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div id="modal-content" class="bg-white rounded-lg shadow-2xl p-6 w-full max-w-lg transform transition-all max-h-[90vh] overflow-y-auto">
            <!-- Modal content will be dynamically updated -->
        </div>
    </div>

</div>

<!-- Firebase 載入與設定 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
        getAuth, 
        onAuthStateChanged, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        signOut 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
        getFirestore, doc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, setLogLevel, query, orderBy, writeBatch
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 依據使用者提供的設定
    const firebaseConfig = {
        apiKey: "AIzaSyC3fd-GshapbMcRr5lxRGZUSimUOgc7Pbo",
        authDomain: "divelog-f2c16.firebaseapp.com",
        projectId: "divelog-f2c16",
        storageBucket: "divelog-f2c16.firebasestorage.app",
        messagingSenderId: "993266923402",
        appId: "1:993266923402:web:b8eef51868e65e21e8fa73",
        measurementId: "G-SVPJSB5VKY"
    };

    // 使用 projectId 作為 app ID
    const appId = firebaseConfig.projectId;

    // Set Firebase log level to debug
    setLogLevel('Debug');

    let db = null;
    let auth = null;
    let userId = null; // Stored user ID
    let isAuthReady = false;

    // Global application state
    window.app = {
        currentPage: 'log',
        diveLogs: [],
        gearList: [],
        certifications: [],
        currentEditingLog: null,
        isLoggedIn: false, // New state for login status
        authMode: 'login', // 'login' or 'register'
        authError: '', // Store authentication errors

        setAuthMode(mode) {
            this.authMode = mode;
            this.authError = '';
            this.render();
        },
        
        setPage(page) {
            this.currentPage = page;
            this.render();
            this.updateTabs();
        },

        updateTabs() {
            ['log', 'history', 'info'].forEach(tab => {
                const element = document.getElementById(`tab-${tab}`);
                if (element) {
                    element.classList.remove('tab-active', 'border-teal-500', 'tab-inactive', 'border-gray-200');
                    if (tab === this.currentPage) {
                        element.classList.add('tab-active', 'border-teal-500');
                    } else {
                        element.classList.add('tab-inactive', 'border-gray-200');
                    }
                }
            });
        },
        
        // --- Main Render Function ---
        render() {
            const container = document.getElementById('page-content');
            
            // Check authentication status first
            if (!isAuthReady) {
                container.innerHTML = `<div class="text-center py-12 text-gray-500">正在檢查登入狀態...</div>`;
                return;
            }

            if (!this.isLoggedIn) {
                container.innerHTML = this.renderAuthUI();
                
                // Attach Auth form handlers *after* rendering Auth UI
                const authForm = document.getElementById('login-form') || document.getElementById('register-form');
                if (authForm) {
                    authForm.removeEventListener('submit', this.boundAuthFormHandler);
                    this.boundAuthFormHandler = (e) => this.handleAuthSubmit(e);
                    authForm.addEventListener('submit', this.boundAuthFormHandler);
                }

                return;
            }

            // Render navigation bar for logged-in users
            const navBar = `
                <div class="flex justify-between items-center mb-6">
                    <nav class="flex border-b border-gray-200 flex-grow mr-4">
                        <button onclick="app.setPage('log')" id="tab-log"
                                class="flex-1 py-3 text-center transition duration-150 ease-in-out border-b-2 text-sm md:text-base">
                            新增潛水紀錄
                        </button>
                        <button onclick="app.setPage('history')" id="tab-history"
                                class="flex-1 py-3 text-center transition duration-150 ease-in-out border-b-2 text-sm md:text-base">
                            歷史紀錄與管理
                        </button>
                        <button onclick="app.setPage('info')" id="tab-info"
                                class="flex-1 py-3 text-center transition duration-150 ease-in-out border-b-2 text-sm md:text-base">
                            潛水員/裝備管理
                        </button>
                    </nav>
                    <button onclick="app.handleLogout()" class="py-2 px-3 text-xs bg-red-100 text-red-600 rounded-md hover:bg-red-200 transition duration-150">
                        登出
                    </button>
                </div>
            `;
            
            container.innerHTML = navBar + `<div id="main-content-area"></div>`;
            const contentArea = document.getElementById('main-content-area');
            
            this.updateTabs();

            switch (this.currentPage) {
                case 'log':
                    contentArea.innerHTML = this.renderLogEntryForm();
                    const logForm = document.getElementById('new-log-form');
                    if(logForm) logForm.addEventListener('submit', this.handleNewLogSubmit.bind(this));
                    
                    document.getElementById('dive-mode').addEventListener('change', this.toggleNitroxInput);
                    this.toggleNitroxInput();
                    
                    const dateInput = document.getElementById('date');
                    const entryTimeInput = document.getElementById('entryTime');
                    const exitTimeInput = document.getElementById('exitTime');
                    
                    if (dateInput) dateInput.addEventListener('change', this.calculateDiveDuration.bind(this));
                    if (entryTimeInput) entryTimeInput.addEventListener('change', this.calculateDiveDuration.bind(this));
                    if (exitTimeInput) exitTimeInput.addEventListener('change', this.calculateDiveDuration.bind(this));

                    ['depth_m', 'avg_depth_m', 'time_min', 'air_start_bar', 'air_end_bar', 'tank_volume_l'].forEach(id => {
                        const input = document.getElementById(id);
                        if(input) input.addEventListener('input', this.calculateAndDisplaySAC.bind(this));
                    });
                    this.calculateAndDisplaySAC();
                    break;
                case 'history':
                    contentArea.innerHTML = this.renderHistoryTable();
                    const fileInput = document.getElementById('import-file-input');
                    if (fileInput) {
                        fileInput.addEventListener('change', this.handleFileImport.bind(this));
                    }
                    break;
                case 'info':
                    contentArea.innerHTML = this.renderInfoAndGearManager();
                    this.renderGearList();
                    this.renderCertifications();
                    break;
            }
        },
        
        // --- Authentication UI --- (略，保持原樣)
        renderAuthUI() {
            const isLogin = this.authMode === 'login';
            const title = isLogin ? '潛水日誌登入' : '註冊新帳號';
            const buttonText = isLogin ? '登入' : '註冊';

            return `
                <div class="max-w-md mx-auto p-6 bg-gray-50 rounded-lg shadow-md mt-8">
                    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">${title}</h2>
                    ${this.authError ? `<div class="p-3 mb-4 text-sm text-red-700 bg-red-100 rounded-lg" role="alert">${this.authError}</div>` : ''}
                    <form id="${isLogin ? 'login-form' : 'register-form'}" class="space-y-4">
                        <div><label for="auth_email" class="block text-sm font-medium text-gray-700">電子郵件</label><input type="email" id="auth_email" name="email" required placeholder="your@email.com"></div>
                        <div><label for="auth_password" class="block text-sm font-medium text-gray-700">密碼</label><input type="password" id="auth_password" name="password" required placeholder="至少 6 個字元"></div>
                        ${!isLogin ? `<div><label for="auth_password_confirm" class="block text-sm font-medium text-gray-700">確認密碼</label><input type="password" id="auth_password_confirm" name="password_confirm" required placeholder="再次輸入密碼"></div>` : ''}
                        <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition duration-150">${buttonText}</button>
                    </form>
                    <div class="mt-6 text-center">
                        ${isLogin ? `<p class="text-sm text-gray-600">還沒有帳號嗎？<button type="button" onclick="app.setAuthMode('register')" class="text-indigo-600 hover:text-indigo-800 font-medium">立即註冊</button></p>` : `<p class="text-sm text-gray-600">已經有帳號了？<button type="button" onclick="app.setAuthMode('login')" class="text-indigo-600 hover:text-indigo-800 font-medium">返回登入</button></p>`}
                    </div>
                </div>
            `;
        },

        // --- Authentication Handlers --- (略，保持原樣)
        handleAuthSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const email = form.auth_email.value;
            const password = form.auth_password.value;
            if (form.id === 'login-form') this.handleLogin(email, password);
            else if (form.id === 'register-form') {
                if (password !== form.auth_password_confirm.value) { this.authError = '密碼不一致'; this.render(); return; }
                this.handleRegister(email, password);
            }
        },
        async handleLogin(email, password) {
            this.authError = '';
            try { await signInWithEmailAndPassword(auth, email, password); } 
            catch (error) { this.authError = '登入失敗，請檢查帳號密碼'; this.render(); }
        },
        async handleRegister(email, password) {
            this.authError = '';
            try { await createUserWithEmailAndPassword(auth, email, password); } 
            catch (error) { this.authError = '註冊失敗'; this.render(); }
        },
        async handleLogout() { try { await signOut(auth); } catch (e) { console.error(e); } },
        
        // --- Calculation Logic --- (略，保持原樣)
        calculateDiveDuration() {
            const dateInput = document.getElementById('date');
            const entryInput = document.getElementById('entryTime');
            const exitInput = document.getElementById('exitTime');
            const durationInput = document.getElementById('time_min');
            if (dateInput && entryInput && exitInput && dateInput.value && entryInput.value && exitInput.value) {
                const dateStr = dateInput.value;
                const start = new Date(`${dateStr}T${entryInput.value}`);
                const end = new Date(`${dateStr}T${exitInput.value}`);
                let diffMs = end - start;
                if (diffMs < 0) diffMs += 24 * 60 * 60 * 1000;
                if (diffMs > 0) {
                    const diffMins = Math.floor(diffMs / 60000);
                    if (durationInput) { durationInput.value = diffMins; durationInput.dispatchEvent(new Event('input')); }
                }
            }
        },
        calculateSAC(avgDepthM, timeMin, startBar, endBar, tankVolumeL) {
            if (!avgDepthM || !timeMin || !startBar || !endBar || !tankVolumeL || timeMin <= 0 || startBar <= endBar) return null;
            const pressureUsed = startBar - endBar;
            const avgPressureAtm = (avgDepthM / 10) + 1;
            const volumeUsed = pressureUsed * tankVolumeL;
            return (volumeUsed / timeMin) / avgPressureAtm;
        },
        calculateAndDisplaySAC() {
            const inputs = ['avg_depth_m', 'time_min', 'air_start_bar', 'air_end_bar', 'tank_volume_l'].map(id => document.getElementById(id)?.value);
            const sac = this.calculateSAC(parseFloat(inputs[0]), parseInt(inputs[1]), parseInt(inputs[2]), parseInt(inputs[3]), parseFloat(inputs[4]));
            const resultEl = document.getElementById('sac-result');
            if (!resultEl) return;
            if (sac && !isNaN(sac) && sac > 0) {
                resultEl.innerHTML = `<p class="text-lg font-bold text-teal-600">SAC 率: <span class="text-2xl">${sac.toFixed(2)} L/min</span></p>
                <p class="text-sm text-gray-500 mt-1">**SAC 壓力消耗率：** <span class="font-bold">${((sac / parseFloat(inputs[4])) * 10).toFixed(2)} Bar/min</span></p>`;
            } else {
                resultEl.innerHTML = `<p class="text-gray-500">請輸入完整數據以計算 SAC。</p>`;
            }
        },

        // --- Export / Import Handlers (UPDATED) ---

        exportLogs() {
            if (this.diveLogs.length === 0) { alert("目前沒有紀錄可匯出！"); return; }
            const dataStr = JSON.stringify(this.diveLogs, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `dive_logs_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        },

        triggerImport() {
            const fileInput = document.getElementById('import-file-input');
            if (fileInput) fileInput.click();
        },

        // Helper to convert Excel row keys to App keys
        mapExcelRowToLog(row) {
            // Mapping dictionary (Excel Header -> Internal Key)
            const map = {
                '日期': 'date', 'Date': 'date',
                '潛點': 'location', 'Location': 'location',
                '最大深度': 'depth_m', 'Max Depth': 'depth_m',
                '平均深度': 'avg_depth_m', 'Avg Depth': 'avg_depth_m',
                '潛水時間': 'time_min', 'Duration': 'time_min', 'Time': 'time_min',
                '起始壓力': 'air_start_bar', 'Start Pressure': 'air_start_bar',
                '結束壓力': 'air_end_bar', 'End Pressure': 'air_end_bar',
                '氣瓶容積': 'tank_volume_l', 'Tank Volume': 'tank_volume_l',
                '入水時間': 'entryTime', 'Entry Time': 'entryTime',
                '出水時間': 'exitTime', 'Exit Time': 'exitTime',
                '潛水類型': 'diveType', 'Dive Type': 'diveType',
                '浪況': 'waveCondition', 'Wave': 'waveCondition',
                '流況': 'currentCondition', 'Current': 'currentCondition',
                '天氣': 'weather', 'Weather': 'weather',
                '水溫': 'water_temp_c', 'Water Temp': 'water_temp_c',
                '能見度': 'visibility_m', 'Visibility': 'visibility_m',
                '模式': 'mode', 'Mode': 'mode',
                '高氧': 'o2_percent', 'Nitrox': 'o2_percent', 'O2': 'o2_percent',
                '配重': 'weight_kg', 'Weight': 'weight_kg',
                '潛伴': 'buddy', 'Buddy': 'buddy',
                '潛導': 'dive_guide', 'Guide': 'dive_guide',
                '潛店': 'dive_shop', 'Shop': 'dive_shop',
                '筆記': 'notes', 'Notes': 'notes',
                '備註': 'notes'
            };

            const newLog = { created_at: new Date().toISOString(), imported_at: new Date().toISOString() };
            
            for (const [key, value] of Object.entries(row)) {
                // Determine target key
                let targetKey = map[key] || key; // Default to original key if no match
                
                // Value conversion
                let processedValue = value;

                // Handle Date (Excel dates are sometimes numbers)
                if (targetKey === 'date' && typeof value === 'number') {
                    // Basic Excel date to JS date conversion
                    const dateObj = new Date(Math.round((value - 25569)*86400*1000));
                    processedValue = dateObj.toISOString().slice(0, 10);
                } else if (targetKey.includes('Time') && typeof value === 'number') {
                     // Handle Excel time fraction
                     const totalSeconds = Math.floor(value * 86400);
                     const hours = Math.floor(totalSeconds / 3600);
                     const minutes = Math.floor((totalSeconds % 3600) / 60);
                     processedValue = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                }

                newLog[targetKey] = processedValue;
            }
            return newLog;
        },

        handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const extension = file.name.split('.').pop().toLowerCase();

            if (extension === 'json') {
                this.processJsonImport(file);
            } else if (['xlsx', 'xls', 'csv'].includes(extension)) {
                this.processExcelImport(file);
            } else {
                alert("不支援的檔案格式。請使用 .json, .xlsx, .xls 或 .csv。");
            }
            event.target.value = ''; // Reset
        },

        processJsonImport(file) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const importedLogs = JSON.parse(e.target.result);
                    this.batchUploadLogs(importedLogs);
                } catch (error) {
                    console.error("JSON Import error:", error);
                    alert("JSON 解析失敗。");
                }
            };
            reader.readAsText(file);
        },

        processExcelImport(file) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Convert to JSON
                    const rawData = XLSX.utils.sheet_to_json(worksheet);
                    
                    // Map headers
                    const mappedLogs = rawData.map(row => this.mapExcelRowToLog(row));
                    
                    this.batchUploadLogs(mappedLogs);

                } catch (error) {
                    console.error("Excel Import error:", error);
                    alert(`Excel 解析失敗: ${error.message}`);
                }
            };
            reader.readAsArrayBuffer(file);
        },

        async batchUploadLogs(logs) {
            if (!Array.isArray(logs) || logs.length === 0) {
                alert("沒有找到可匯入的紀錄。");
                return;
            }

            if (confirm(`解析到 ${logs.length} 筆紀錄。確定要匯入嗎？`)) {
                let successCount = 0;
                const logsRef = this.getCollectionRef('logs');
                
                // Simple loop for import
                for (const log of logs) {
                    // Minimal validation
                    if (log.date || log.location) { // Allow loose validation for excel rows
                        // Remove ID to create new one
                        const { id, ...logData } = log;
                        
                        // Sanitize numeric fields if they came in as strings
                        ['depth_m', 'avg_depth_m', 'time_min', 'air_start_bar', 'air_end_bar', 'tank_volume_l', 'weight_kg'].forEach(field => {
                            if (logData[field] && typeof logData[field] === 'string') {
                                logData[field] = parseFloat(logData[field]);
                            }
                        });

                        // Calculate SAC if missing but data exists
                        if (!logData.avg_sac_l_min && logData.avg_depth_m && logData.time_min && logData.air_start_bar && logData.air_end_bar && logData.tank_volume_l) {
                            logData.avg_sac_l_min = this.calculateSAC(logData.avg_depth_m, logData.time_min, logData.air_start_bar, logData.air_end_bar, logData.tank_volume_l);
                        }

                        try {
                            await addDoc(logsRef, logData);
                            successCount++;
                        } catch (err) {
                            console.warn("Skipped invalid row", log, err);
                        }
                    }
                }
                alert(`成功匯入 ${successCount} 筆紀錄！`);
            }
        },

        // --- View Rendering Functions ---

        renderLogEntryForm(log = null) {
            // ... (Same as previous renderLogEntryForm) ...
            const isEdit = !!log;
            const title = isEdit ? '修改潛水紀錄' : '新增潛水紀錄';
            const buttonText = isEdit ? '儲存變更' : '新增紀錄';
            const logDate = log ? log.date : new Date().toISOString().substring(0, 10);
            const entryTime = log ? (log.entryTime || '') : '';
            const exitTime = log ? (log.exitTime || '') : '';
            const diveType = log ? (log.diveType || '岸潛') : '岸潛';
            const waveCondition = log ? (log.waveCondition || '') : '';
            const currentCondition = log ? (log.currentCondition || '') : '';
            const weather = log ? (log.weather || '') : '';
            const mode = log ? log.mode : 'Air';
            const o2_percent = log ? log.o2_percent : '21';
            const avg_depth_m = log ? log.avg_depth_m : '';
            const tank_volume_l = log ? log.tank_volume_l : '12.0';
            const weight_kg = log ? (log.weight_kg || '') : '';
            const buddy = log ? (log.buddy || '') : '';
            const dive_guide = log ? (log.dive_guide || '') : '';
            const dive_shop = log ? (log.dive_shop || '') : '';

            const gearCheckboxes = this.gearList.map(gear => {
                const isChecked = log && log.gear_used && log.gear_used.includes(gear.name);
                return `
                    <label class="flex items-center space-x-2 text-gray-700">
                        <input type="checkbox" name="gear_used" value="${gear.name}" class="rounded text-teal-500 focus:ring-teal-500" ${isChecked ? 'checked' : ''}>
                        <span>${gear.name}</span>
                    </label>
                `;
            }).join('');

            return `
                <form id="${isEdit ? 'edit-log-form' : 'new-log-form'}" class="space-y-4 p-4 md:p-6 bg-white rounded-lg shadow-md">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">${title}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-1"><label for="date" class="block text-sm font-medium text-gray-700">潛水日期</label><input type="date" id="date" name="date" required value="${logDate}"></div>
                        <div class="space-y-1"><label for="location" class="block text-sm font-medium text-gray-700">潛點名稱</label><input type="text" id="location" name="location" required placeholder="如：綠島大白沙" value="${log ? log.location : ''}"></div>
                    </div>
                    <h3 class="text-xl font-medium text-gray-700 mt-6 pt-4 border-t">時間與類型</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-1"><label for="entryTime" class="block text-sm font-medium text-gray-700">入水時間</label><input type="time" id="entryTime" name="entryTime" required value="${entryTime}"></div>
                        <div class="space-y-1"><label for="exitTime" class="block text-sm font-medium text-gray-700">出水時間</label><input type="time" id="exitTime" name="exitTime" required value="${exitTime}"></div>
                    </div>
                    <div class="space-y-1 mt-4">
                        <label class="block text-sm font-medium text-gray-700">潛水類型</label>

        handleNewLogSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const gearUsed = [];
            formData.getAll('gear_used').forEach(item => gearUsed.push(item));
            const avgDepthM = parseFloat(formData.get('avg_depth_m'));
            const timeMin = parseInt(formData.get('time_min'), 10);
            const startBar = parseInt(formData.get('air_start_bar'), 10);
            const endBar = parseInt(formData.get('air_end_bar'), 10);
            const tankVolumeL = parseFloat(formData.get('tank_volume_l'));
            const sacValue = this.calculateSAC(avgDepthM, timeMin, startBar, endBar, tankVolumeL);
            const newLog = {
                date: formData.get('date'),
                location: formData.get('location'),
                entryTime: formData.get('entryTime'),
                exitTime: formData.get('exitTime'),
                diveType: formData.get('diveType'),
                waveCondition: formData.get('waveCondition'),
                currentCondition: formData.get('currentCondition'),
                weather: formData.get('weather'),
                weight_kg: formData.get('weight_kg') ? parseFloat(formData.get('weight_kg')) : null,
                buddy: formData.get('buddy'),
                dive_guide: formData.get('dive_guide'),
                dive_shop: formData.get('dive_shop'),
                depth_m: parseFloat(formData.get('depth_m')),
                avg_depth_m: avgDepthM,
                time_min: timeMin,
                tank_volume_l: tankVolumeL,
                water_temp_c: formData.get('water_temp_c') ? parseFloat(formData.get('water_temp_c')) : null,
                air_start_bar: startBar,
                air_end_bar: endBar,
                visibility_m: formData.get('visibility_m') ? parseInt(formData.get('visibility_m'), 10) : null,
                mode: formData.get('mode'),
                o2_percent: formData.get('mode') === 'Nitrox' ? parseInt(formData.get('o2_percent'), 10) : 21,
                notes: formData.get('notes'),
                gear_used: gearUsed,
                avg_sac_l_min: sacValue,
                created_at: new Date().toISOString()
            };
            this.addLog(newLog);
            form.reset();
            document.getElementById('o2_percent').value = '21';
            document.getElementById('tank_volume_l').value = '12.0';
            this.setPage('history');
        },

            const updatedLog = {
                date: formData.get('date'),
                location: formData.get('location'),
                entryTime: formData.get('entryTime'),
                exitTime: formData.get('exitTime'),
                diveType: formData.get('diveType'),
                waveCondition: formData.get('waveCondition'),
                currentCondition: formData.get('currentCondition'),
                weather: formData.get('weather'),
                weight_kg: formData.get('weight_kg') ? parseFloat(formData.get('weight_kg')) : null,
                buddy: formData.get('buddy'),
                dive_guide: formData.get('dive_guide'),
                dive_shop: formData.get('dive_shop'),
                depth_m: parseFloat(formData.get('depth_m')),
                avg_depth_m: avgDepthM,
                time_min: timeMin,
                tank_volume_l: tankVolumeL,
                water_temp_c: formData.get('water_temp_c') ? parseFloat(formData.get('water_temp_c')) : null,
                air_start_bar: startBar,
                air_end_bar: endBar,
                visibility_m: formData.get('visibility_m') ? parseInt(formData.get('visibility_m'), 10) : null,
                mode: formData.get('mode'),
                o2_percent: formData.get('mode') === 'Nitrox' ? parseInt(formData.get('o2_percent'), 10) : 21,
                notes: formData.get('notes'),
                gear_used: gearUsed,
                avg_sac_l_min: sacValue,
                updated_at: new Date().toISOString()
            };
            this.updateLog(logId, updatedLog);
            this.closeModal();
        },
        async updateLog(logId, updatedData) {
            const logsRef = this.getCollectionRef('logs');
            if (!logsRef) return;
            try { await updateDoc(doc(logsRef, logId), updatedData); console.log('Log updated successfully'); } catch (e) { console.error('Error updating document: ', e); }
        },
        async deleteLog(logId) {
            const logsRef = this.getCollectionRef('logs');
            if (!logsRef) return;
            try { await deleteDoc(doc(logsRef, logId)); this.closeModal(); console.log('Log deleted successfully'); } catch (e) { console.error('Error deleting document: ', e); }
        },
        handleNewCertificationSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const newCert = {
                agency: formData.get('agency').trim(),
                level: formData.get('level').trim(),
                number: formData.get('number').trim(),
                date: formData.get('date'),
                created_at: new Date().toISOString()
            };
            if (newCert.agency && newCert.level) { this.addCertification(newCert); form.reset(); }
        },
        async addCertification(certData) {
            const certRef = this.getCollectionRef('certifications');
            if (!certRef) return;
            try { await addDoc(certRef, certData); console.log('Certification added successfully'); } catch (e) { console.error('Error adding certification: ', e); }
        },
        async deleteCertification(certId) {
            const certRef = this.getCollectionRef('certifications');
            if (!certRef) return;
            try { await deleteDoc(doc(certRef, certId)); console.log('Certification deleted successfully'); } catch (e) { console.error('Error deleting certification: ', e); }
        },
        handleNewGearSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const gearName = document.getElementById('new_gear_name').value.trim();
            if (gearName) { this.addGear({ name: gearName, created_at: new Date().toISOString() }); form.reset(); }
        },
        async addGear(gearData) {
            const gearRef = this.getCollectionRef('gear');
            if (!gearRef) return;
            try { await addDoc(gearRef, gearData); console.log('Gear added successfully'); } catch (e) { console.error('Error adding gear: ', e); }
        },
        async deleteGear(gearId) {
            const gearRef = this.getCollectionRef('gear');
            if (!gearRef) return;
            try { await deleteDoc(doc(gearRef, gearId)); console.log('Gear deleted successfully'); } catch (e) { console.error('Error deleting gear: ', e); }
        },
        setupListeners() {
            if (!db || !userId) return;
            const logsRef = this.getCollectionRef('logs');
            if (logsRef) {
                const logsQuery = query(logsRef, orderBy('date', 'desc'));
                onSnapshot(logsQuery, (snapshot) => { this.diveLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); this.render(); }, (error) => console.error("Error listening to logs:", error));
            }
            const gearRef = this.getCollectionRef('gear');
            if (gearRef) { onSnapshot(gearRef, (snapshot) => { this.gearList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); this.render(); }, (error) => console.error("Error listening to gear:", error)); }
            const certsRef = this.getCollectionRef('certifications');
            if (certsRef) { onSnapshot(certsRef, (snapshot) => { this.certifications = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); this.render(); }, (error) => console.error("Error listening to certifications:", error)); }
            
            const contentContainer = document.getElementById('page-content');
            contentContainer.removeEventListener('submit', this.boundLogFormHandler);
            contentContainer.removeEventListener('submit', this.boundGearFormHandler);
            contentContainer.removeEventListener('submit', this.boundCertFormHandler);
            
            this.boundLogFormHandler = (e) => { if (e.target.id === 'new-log-form') this.handleNewLogSubmit(e); };
            this.boundGearFormHandler = (e) => { if (e.target.id === 'new-gear-form') this.handleNewGearSubmit(e); };
            this.boundCertFormHandler = (e) => { if (e.target.id === 'new-certification-form') this.handleNewCertificationSubmit(e); };
            
            contentContainer.addEventListener('submit', this.boundLogFormHandler);
            contentContainer.addEventListener('submit', this.boundGearFormHandler);
            contentContainer.addEventListener('submit', this.boundCertFormHandler);
        },
        async init() {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            onAuthStateChanged(auth, (user) => {
                isAuthReady = true;
                if (user) { userId = user.uid; this.isLoggedIn = true; console.log(`User logged in with userId: ${userId}`); this.setupListeners(); } 
                else { userId = null; this.isLoggedIn = false; this.authError = ''; console.log("No user signed in."); this.diveLogs = []; this.gearList = []; this.certifications = []; document.getElementById('page-content').addEventListener('submit', (e) => { if (e.target.id === 'login-form' || e.target.id === 'register-form') { this.handleAuthSubmit(e); } }); }
                this.render();
            });
        }
    };
    window.onload = () => { window.app.init(); };
</script>
</body>
</html>
